services:
  - type: pserv
    runtime: docker
    name: mysql
    repo: https://github.com/render-examples/mysql.git
    envVars:
      - key: MYSQL_DATABASE
        value: homemade_food
      - key: MYSQL_USER
        value: food_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  - type: web
    name: homemade-food-web
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    initialDeployHook: python manage.py loaddata sqlite_to_mysql_fixture.json
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn food_system.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: "django.db.backends.mysql"
      - key: DB_NAME
        fromService:
          name: mysql
          type: pserv
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          name: mysql
          type: pserv
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          name: mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: DB_HOST
        fromService:
          name: mysql
          type: pserv
          property: host
      - key: DB_PORT
        fromService:
          name: mysql
          type: pserv
          property: port
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
