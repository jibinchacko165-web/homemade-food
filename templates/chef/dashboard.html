{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
    <!-- Welcome Header -->
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1.5rem; margin-bottom: 3rem; background: var(--white); padding: 2.5rem; border-radius: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);">
        <div>
            <h2 style="font-size: 2.5rem; color: var(--dark); margin: 0; font-weight: 800;">Analytics: {{ user.username }}</h2>
            <p style="color: var(--dark-light); font-size: 1.1rem; margin-top: 0.5rem;">Overview of your kitchen's performance.</p>
        </div>
    </div>

    <!-- Stats Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
        <div class="card" style="padding: 1.8rem; border-radius: 20px; text-align: center; background: linear-gradient(135deg, var(--white) 0%, var(--cream) 100%);">
            <i class="fa-solid fa-bowl-food" style="font-size: 2rem; color: var(--primary); margin-bottom: 1rem;"></i>
            <h3 style="font-size: 2rem; margin: 0;">{{ total_items }}</h3>
            <p style="color: var(--dark-light); font-weight: 600; margin: 0;">Total Dishes</p>
        </div>
        <div class="card" style="padding: 1.8rem; border-radius: 20px; text-align: center; background: linear-gradient(135deg, var(--white) 0%, #e3f2fd 100%);">
            <i class="fa-solid fa-basket-shopping" style="font-size: 2rem; color: #1976d2; margin-bottom: 1rem;"></i>
            <h3 style="font-size: 2rem; margin: 0;">{{ total_orders }}</h3>
            <p style="color: var(--dark-light); font-weight: 600; margin: 0;">Total Orders</p>
        </div>
        <div class="card" style="padding: 1.8rem; border-radius: 20px; text-align: center; background: linear-gradient(135deg, var(--white) 0%, #fff3e0 100%);">
            <i class="fa-solid fa-clock" style="font-size: 2rem; color: var(--warm-orange); margin-bottom: 1rem;"></i>
            <h3 style="font-size: 2rem; margin: 0;">{{ pending_orders }}</h3>
            <p style="color: var(--dark-light); font-weight: 600; margin: 0;">Pending Orders</p>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let currentPending = parseInt("{{ pending_orders|default:'0' }}", 10);
    
    // Poll every 10 seconds for new orders
    setInterval(function() {
        fetch("{% url 'orders:check_new_orders' %}")
            .then(response => response.json())
            .then(data => {
                if (data.pending_count !== undefined && data.pending_count > currentPending) {
                    // Show custom toast notification
                    showToast("New order received! Refreshing dashboard...", "bell", "#28a745");
                    
                    // Update badge immediately
                    let badge = document.getElementById('dashboard-orders-badge');
                    if (badge) {
                        badge.innerText = data.pending_count;
                        badge.style.display = 'block';
                        badge.style.animation = 'pulse 1s infinite';
                    }
                    
                    currentPending = data.pending_count;
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                } else if (data.pending_count !== undefined) {
                    currentPending = data.pending_count;
                }
            })
            .catch(error => console.error("Error checking orders:", error));
    }, 10000);
});
</script>

<style>
    .hover-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-md) !important;
    }
    .hover-item:hover {
        background: var(--cream);
    }
    .hover-item:last-child {
        border-bottom: none;
    }
</style>
{% endblock %}
