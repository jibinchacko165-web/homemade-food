{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; padding: clamp(1rem, 5vw, 2rem) 0;">
    <div class="card responsive-card" style="width: 100%; max-width: 600px; box-shadow: var(--shadow-lg);">
        <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
            <h2 style="font-weight: 800; font-size: clamp(1.5rem, 6vw, 2rem); color: var(--dark);">{{ title }}</h2>
        </div>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color: var(--primary); font-size: 0.85rem; margin-top: 0.4rem;">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ field.errors.0 }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1; min-width: 150px;"><i class="fa-solid fa-save"></i> Save Dish</button>
                <a href="{% url 'chef:dashboard' %}" class="btn btn-outline" style="flex: 1; min-width: 150px;">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
    .form-group input[type="checkbox"] { width: auto; margin-right: 0.5rem; }
    .form-group label[for="id_is_available"] { display: inline-block; margin-bottom: 0; }
</style>
{% endblock %}
