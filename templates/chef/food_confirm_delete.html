{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; padding: 3rem; border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center;">
    <div style="width: 80px; height: 80px; background: rgba(255,107,107,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: var(--primary);"></i>
    </div>
    <h2 style="font-size: 2rem; color: var(--dark); margin-bottom: 1rem;">Delete Dish?</h2>
    <p style="color: var(--dark-light); font-size: 1.1rem; margin-bottom: 2rem;">Are you sure you want to delete "<strong>{{ food.name }}</strong>"? This action cannot be undone.</p>
    
    <form method="post" style="display: flex; gap: 1rem;">
        {% csrf_token %}
        <a href="{% url 'seller_dashboard' %}" class="btn btn-outline" style="flex: 1;">Cancel</a>
        <button type="submit" class="btn btn-primary" style="flex: 1; background: var(--primary);">Yes, Delete</button>
    </form>
</div>
{% endblock %}
